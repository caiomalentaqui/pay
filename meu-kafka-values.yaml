global:
  security:
    allowInsecureImages: true

# O resto do seu arquivo continua igual...
image:
  repository: apache/kafka
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

# Mantendo seus padrões de Design System
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

persistence:
  enabled: false

kraft:
  enabled: true

# Adicione/Ajuste isso no seu values.yaml
containerSecurityContext:
  enabled: false
podSecurityContext:
  enabled: false

# Forçar o uso de variáveis de ambiente que a imagem da Apache entende
extraEnvVars:
  - name: KAFKA_NODE_ID
    value: "1"
  - name: KAFKA_PROCESS_ROLES
    value: "broker,controller"
  - name: KAFKA_LISTENERS
    value: "PLAINTEXT://:9092,CONTROLLER://:9093"